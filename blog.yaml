apiVersion: apps/v1
kind: Deployment
metadata:
  name: blogdep
  labels:
    type: app
spec:
  replicas: 2
  selector:
    matchLabels:
      type: app
  template:
    metadata:
      labels:
        type: app
    spec:
      containers:
        - name: blog
          image: 6esusigugh/susigughimg:0109

